name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run demo
      - run: node bin/graph-ai.js evaluate --fixture examples/loan-fulfillment
      - run: node bin/graph-ai.js evaluate --fixture examples/organization-access
      - run: node bin/graph-ai.js benchmark --files 200
